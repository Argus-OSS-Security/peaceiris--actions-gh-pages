name: Check Pages Status

# Triggers intentionally disabled for Argus-OSS-Security.
# on: page_build

jobs:
  pages-status-check:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: check status
        run: |
          status = '${{ github.event.build.status }}'
          errormsg = '${{ github.event.build.error.message }}'
          assert status == 'built', 'Status: {status}\nError: {errormsg}'.format(status, errormsg)
        shell: python
